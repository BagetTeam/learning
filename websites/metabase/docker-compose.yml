services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase-agent-server
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:15
    container_name: metabase-agent-db
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  my-db:
    image: postgres:15
    container_name: metabase-my-data
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample_data
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - my_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metabase-setup
    environment:
      # Inside the container, localhost is not Metabase — use the compose service name.
      METABASE_URL: http://metabase:3000
    depends_on:
      metabase:
        condition: service_healthy
      my-db:
        condition: service_healthy
    volumes:
      - ./.auth:/app/.auth

volumes:
  metabase_data:
  postgres_data:
  my_data:
