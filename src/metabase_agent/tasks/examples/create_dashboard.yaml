id: create_dashboard
name: Create a dashboard with specific elements
instruction: >
  Create a new dashboard named "Sales Overview" with the following elements:
  1. A card showing total revenue (scalar/number)
  2. A bar chart showing sales by region
  3. A line chart showing sales trend over time
  Save the dashboard when complete.
start_url: http://localhost:3000
max_steps: 50
timeout_seconds: 900
success_criteria:
  - dashboard_exists
  - dashboard_name_contains: Sales Overview
  - dashboard_card_count: 3
tags:
  - intermediate
  - dashboard
  - create
notes: >
  Tests dashboard creation with multiple visualization types.
  May require existing questions or creating questions on the fly.
