id: summarize_dashboard
name: Summarize dashboard insights
instruction: >
  Open the Sales dashboard, analyze the data shown in each visualization,
  and provide a written summary of the key insights. The summary should include:
  1. Overall sales performance trends
  2. Top performing regions or categories
  3. Any notable anomalies or patterns
  Provide the summary in your response.
start_url: http://localhost:3000
max_steps: 20
timeout_seconds: 600
success_criteria:
  - url_contains: dashboard
  - response_contains: sales
tags:
  - intermediate
  - dashboard
  - analysis
  - summarization
notes: >
  Tests the agent's ability to interpret visualizations and provide insights.
  Requires a Sales dashboard with meaningful data.
