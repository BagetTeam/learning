id: export_dashboard
name: Export dashboard to PDF
instruction: >
  Navigate to the Sales dashboard and export it as a PDF file.
start_url: http://localhost:3000
max_steps: 20
timeout_seconds: 300
success_criteria:
  - file_downloaded
  - file_extension: pdf
tags:
  - beginner
  - dashboard
  - export
notes: >
  Requires a Sales dashboard to exist in Metabase.
  The PDF should be saved to the downloads directory.
